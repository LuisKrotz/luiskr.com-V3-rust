# glitch — the about-portrait VHS corruption widget.
#
# Replaces the 2D-canvas glitch pipeline (fillRect grain ×460/frame,
# drawImage channel ghosts, scanline pattern fills) with ONE textured
# fullscreen draw: the portrait uploads once via `bitmap_texture`, all
# corruption decisions (hit chance, band/block positions, inversion,
# grain) are hashed in-shader from a per-frame xorshift seed — zero
# per-frame CPU beyond a 16-f32 uniform write.
#
# The `web-sys` surface is gpu-mini's — nothing widget-specific here.

[package]
name = "luiskr-glitch"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
gpu-mini = { path = "../gpu-mini" }

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement", "ImageBitmap", "gpu_buffer_usage"]

# Same wasm-opt flag contract as every widget crate.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-all"]
