# burn — the mosaic title's paper-combustion particle sim. Own
# artifact: CPU sim in Rust (deterministic, dt-space), instanced quads
# via a storage buffer. Lazy-loaded on first mosaic hover.

[package]
name = "luiskr-burn"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
gpu-mini = { path = "../gpu-mini" }

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement", "gpu_buffer_usage"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-all"]
