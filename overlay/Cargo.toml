# overlay — WebGPU render surface for the dual-layer architecture.
#
# Draws the visual frame (quads, textures, text) while the prerendered
# HTML keeps owning SEO/accessibility. Runs on wasm32-unknown-unknown;
# JS calls `Overlay::frame(dt)` once per rAF tick.
#
# Dependency contract:
#   wgpu ↔ glyphon must stay version-paired (glyphon is released in
#   lockstep against wgpu's API) — bump them together or the pipeline
#   fails to compile. wgpu 25 ⇄ glyphon 0.9.
#   getrandom needs the wasm_js backend or every call traps on wasm32.

[package]
name = "luiskr-overlay"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wgpu = { version = "25", features = ["webgl"] }
glyphon = "0.9"
bytemuck = { version = "1", features = ["derive"] }
# NOTE: keep the dep list lean — every crate lands in the served .wasm.
# (glam/serde were dropped: nothing used them; dead deps still bloat
# the build graph and audit surface.)
# Rust-side image decode (jpeg/png/webp) → RGBA8 for media widgets —
# keeps decode off the browser main thread entirely. default-features
# off trims formats we never ship (avif/exr/tga…) so the wasm stays small.
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }

[dependencies.web-sys]
version = "0.3"
features = [
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "Performance",
  "Window",
]

# getrandom (pulled in transitively) must bind to the Web Crypto API on
# wasm32 — without this backend every RNG call aborts.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# rustc's wasm32 baseline already emits bulk-memory/multivalue ops; the
# wasm-pack-bundled wasm-opt rejects them unless features are enabled —
# `-all` accepts the whole instruction set. `-Oz` trades peak speed for
# the smallest artifact — the wasm loads lazily over the network.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-all"]
