# markdown — CommonMark+GFM → HTML, replacing `marked` at build time.
#
# `shared/build/docs/render.mjs` parsed portal markdown through the
# `marked` npm package (18.x, ~350KB of regex-driven JS that runs on
# every docs build). This crate wraps pulldown-cmark — a pull-parser
# CommonMark engine with the GFM extensions — for the same contract:
# markdown string in, HTML string out, caller does the project-specific
# post-passes (heading ids, script strip, lazy imgs, mermaid divs).
#
# Enabled extensions mirror `marked.use({ gfm: true })`:
#   tables · strikethrough · tasklists · bare-URL autolinks (GFM).
# Deliberately OFF for marked parity: footnotes, smart punctuation,
# heading attributes, math, wikilinks — none of those were live before.
#
# API: one function — `markdown_to_html(source) -> String`.
# Build-time only (Node loads the artifact synchronously via initSync);
# the .wasm never travels the site bundle, so size is a non-issue.

[package]
name = "luiskr-markdown"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# `html` is opt-in (default-features off keeps the parse-only surface
# lean — we only need the HTML renderer anyway).
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

# Same wasm-opt flag contract as every crate.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-all"]
