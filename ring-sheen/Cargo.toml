# ring-sheen — the tile border sheen ring (mosaic + related items).
#
# Replaces the masked-gradient ::before/::after ring on
# `.home-mosaic-item` / `.related-item` with ONE overlay canvas per
# container: per-tile rects go down a storage sheet, the shader draws
# every ring as an instanced SDF quad — one draw call for the whole
# grid instead of N pseudo-element layers + per-tile compositor work.
#
# The `web-sys` surface is gpu-mini's — nothing widget-specific here.

[package]
name = "luiskr-ring-sheen"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
gpu-mini = { path = "../gpu-mini" }

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement", "gpu_buffer_usage"]

# Same wasm-opt flag contract as every widget crate.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-all"]
