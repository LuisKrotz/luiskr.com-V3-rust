# genie — the expand-modal media mesh-warp + vapor particle transition.
#
# Replaces the CSS modal zoom with a macOS-style genie field: the media
# texture is drawn as an N-row mesh whose vertices deform through the
# shared genie field (lag/bow/bell — see `core/tokens/motion/genie.ts`
# for the identical field math the 2D backend runs), and a wasm-side
# particle sim sheds vapor along the moving fold. Own artifact, lazy-
# loaded when the expand modal mounts under the WebGPU opt-in.
#
# The `web-sys` surface is gpu-mini's — nothing widget-specific here.

[package]
name = "luiskr-genie"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
gpu-mini = { path = "../gpu-mini" }

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement", "gpu_buffer_usage", "ImageBitmap"]

# Same wasm-opt flag contract as every widget crate.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-all"]
