# text-draw — the per-character writing animation (draw-text component).
#
# Replaces the CSS per-char span animation (opacity + translateY
# stagger) with ONE instanced draw: JS rasterizes the chars into an
# atlas ONCE (the browser's font engine does the raster — fonts don't
# exist in wasm), pushes per-char dest/uv rects + delays through a
# storage buffer, and the vertex shader runs the full
# cubic-bezier(0.22,1,0.36,1) stagger on GPU. The DOM text stays in
# place for indexability/a11y — the canvas is the visual layer.
#
# The `web-sys` surface is gpu-mini's — nothing widget-specific here.

[package]
name = "luiskr-text-draw"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
gpu-mini = { path = "../gpu-mini" }

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement", "ImageBitmap", "gpu_buffer_usage"]

# Same wasm-opt flag contract as every widget crate.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-all"]
