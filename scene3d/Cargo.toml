# scene3d — the WebGPU 3D renderer that replaces three.js for the
# experiments (star-field bodies-scene, earth-playground globe).
#
# This crate exists because `three@0.184` ships ~600KB of JS to drive a
# scene that uses a fixed, small subset of its surface: procedural
# sphere/ring/box/plane geometry, basic+standard+sprite+points
# materials, canvas textures, an orbit camera, and a TSL post chain.
# Porting that subset to wgpu-in-wasm moves ALL scene work — transform
# propagation, frustum tests, draw dispatch — off the JS main thread,
# and drops the served artifact to a fraction of three's chunk.
#
# Architecture: a flat scene graph (indices, not pointers), a typed
# resource registry for geometries/materials/textures, and a single
# forward pass + TSL-parity post chain (film grain, chromatic
# aberration, bloom) — all documented per-field in `math.rs` and
# `lib.rs`.

[package]
name = "luiskr-scene3d"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

# The WebGPU surface only exists on wasm32 — scoping the dep keeps the
# pure-CPU modules (math, geometry) compilable + testable on the host
# (`cargo test -p luiskr-scene3d` runs the geometry invariants without
# a browser).
[target.'cfg(target_arch = "wasm32")'.dependencies.gpu-mini]
path = "../gpu-mini"

# web-sys feature list — the same WebGPU surface gpu-mini declares,
# plus the vertex/primitive/depth types renderer.rs names directly
# (feature unification covers what each crate USES in its own code —
# a crate must declare every type it names).
[dependencies.web-sys]
version = "0.3"
features = [
  "HtmlCanvasElement",
  "Window",
  "Navigator",
  "Gpu",
  "GpuAdapter",
  "GpuDevice",
  "GpuQueue",
  "GpuBuffer",
  "GpuBufferDescriptor",
  "gpu_buffer_usage",
  "gpu_texture_usage",
  "GpuShaderModule",
  "GpuShaderModuleDescriptor",
  "gpu_shader_stage",
  "GpuPipelineLayout",
  "GpuPipelineLayoutDescriptor",
  "GpuRenderPipeline",
  "GpuRenderPipelineDescriptor",
  "GpuVertexState",
  "GpuVertexBufferLayout",
  "GpuVertexAttribute",
  "GpuVertexFormat",
  "GpuVertexStepMode",
  "GpuFragmentState",
  "GpuColorTargetState",
  "GpuBlendState",
  "GpuBlendComponent",
  "GpuBlendFactor",
  "GpuBlendOperation",
  "GpuPrimitiveState",
  "GpuPrimitiveTopology",
  "GpuCullMode",
  "GpuFrontFace",
  "GpuIndexFormat",
  "GpuDepthStencilState",
  "GpuCompareFunction",
  "GpuStencilFaceState",
  "GpuBindGroupLayout",
  "GpuBindGroupLayoutDescriptor",
  "GpuBindGroupLayoutEntry",
  "GpuBufferBindingLayout",
  "GpuBufferBindingType",
  "GpuSamplerBindingLayout",
  "GpuSamplerBindingType",
  "GpuTextureBindingLayout",
  "GpuStorageTextureBindingLayout",
  "GpuBindGroup",
  "GpuBindGroupDescriptor",
  "GpuBindGroupEntry",
  "GpuBufferBinding",
  "GpuCommandEncoder",
  "GpuCommandEncoderDescriptor",
  "GpuCommandBuffer",
  "GpuRenderPassEncoder",
  "GpuRenderPassDescriptor",
  "GpuRenderPassColorAttachment",
  "GpuRenderPassDepthStencilAttachment",
  "GpuCanvasContext",
  "GpuCanvasConfiguration",
  "GpuCanvasAlphaMode",
  "GpuTexture",
  "GpuTextureDescriptor",
  "GpuTextureView",
  "GpuTextureViewDescriptor",
  "gpu_map_mode",
  "gpu_color_write",
  "GpuTextureFormat",
  "GpuTextureDimension",
  "GpuTextureAspect",
  "GpuSampler",
  "GpuSamplerDescriptor",
  "GpuAddressMode",
  "GpuFilterMode",
  "GpuLoadOp",
  "GpuStoreOp",
  "GpuColorDict",
  "GpuTexelCopyTextureInfo",
  "GpuTexelCopyBufferLayout",
  "GpuExtent3dDict",
  "GpuOrigin2dDict",
  "GpuCopyExternalImageSourceInfo",
  "GpuCopyExternalImageDestInfo",
  "ImageBitmap",
]

# Same wasm-opt flag contract as overlay/diagram: rustc's wasm32
# baseline emits bulk-memory/multivalue ops the bundled wasm-opt
# rejects without `-all`.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-all"]
