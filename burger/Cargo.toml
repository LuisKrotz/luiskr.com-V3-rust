# burger — the nav burger's hairline-bars widget (fluid wave + breathe).
# Own artifact, lazy-loaded only when the nav mounts. See rust/README.md
# for the per-artifact architecture.

[package]
name = "luiskr-burger"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
gpu-mini = { path = "../gpu-mini" }

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-all"]
